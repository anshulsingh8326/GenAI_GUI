[project]
name = "genai-gui-backend"
version = "0.1.0"
description = "GenAI GUI backend - FastAPI app serving the GUI, settings, connectors and (later) the GenModules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "mcp>=1.0",
  "pillow>=11.0",
  "psutil>=6.0",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
]
